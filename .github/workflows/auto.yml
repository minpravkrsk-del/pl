name: auto

on:
  schedule:
    - cron: "0 3 * * 4"     # Чт 10:00 КРС — prep (очистка недели)
    - cron: "0 10 * * 4"    # Чт 17:00 КРС — fill (заполнение)
    - cron: "0 3 * * 5"     # Пт 10:00 КРС — sync
    - cron: "0 4 * * 5"     # Пт 11:00 КРС — sync
    - cron: "0 6 * * 5"     # Пт 13:00 КРС — sync
  workflow_dispatch:
    inputs:
      mode:
        description: "prep | fill | sync"
        required: false
        default: "sync"

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-docx
      - name: Run
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          CAL_TOKEN: ${{ secrets.CAL_TOKEN }}
          GOV_CAL_URL: ${{ secrets.GOV_CAL_URL }}
          FORM_URL: ${{ secrets.FORM_URL }}
          FORM_NAME: ${{ secrets.FORM_NAME }}
          FORM_PATH: ${{ secrets.FORM_PATH }}
          STATE_PATH: ${{ secrets.STATE_PATH }}
          SECTIONS: ${{ secrets.SECTIONS }}
          GOVERNORS: ${{ secrets.GOVERNORS }}
          GOV_MARKER: ${{ secrets.GOV_MARKER }}
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          MODE="$(echo "${{ inputs.mode }}" | xargs)"
          case "${{ github.event.schedule }}" in
            "0 3 * * 4")   MODE=prep ;;
            "0 10 * * 4")  MODE=fill ;;
            "0 3 * * 5")   MODE=sync ;;
            "0 4 * * 5")   MODE=sync ;;
            "0 6 * * 5")   MODE=sync ;;
          esac
          echo "Режим запуска: $MODE"
          python scripts/run.py "$MODE"
